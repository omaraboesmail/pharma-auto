name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate contracts
        run: pnpm contracts:validate

      - name: Validate Phase 0 closure
        run: pnpm phase0:validate

      - name: Validate Phase 1 read-only closure
        run: pnpm phase1:validate

  saas:
    name: SaaS Platform
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: pharma_auto
          POSTGRES_PASSWORD: pharma_auto_ci
          POSTGRES_DB: pharma_auto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=pharma_auto --dbname=pharma_auto_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Apply PostgreSQL migrations and replay hardening
        shell: bash
        run: |
          docker cp saas-platform/db/. "${{ job.services.postgres.id }}:/tmp/pharma-auto-db"
          docker exec "${{ job.services.postgres.id }}" \
            psql --username=pharma_auto --dbname=pharma_auto_ci --set=ON_ERROR_STOP=1 \
            --file=/tmp/pharma-auto-db/apply-all.psql
          docker exec "${{ job.services.postgres.id }}" \
            psql --username=pharma_auto --dbname=pharma_auto_ci --set=ON_ERROR_STOP=1 \
            --file=/tmp/pharma-auto-db/002-phase-1-hardening.sql

      - name: Restore locked dependencies
        working-directory: saas-platform
        run: dotnet restore PharmaAuto.Saas.slnx --locked-mode

      - name: Build
        working-directory: saas-platform
        run: dotnet build PharmaAuto.Saas.slnx --no-restore

      - name: Verify formatting
        working-directory: saas-platform
        run: dotnet format PharmaAuto.Saas.slnx --verify-no-changes --no-restore

      - name: Test
        working-directory: saas-platform
        env:
          PHARMA_AUTO_POSTGRES_TEST_CONNECTION_STRING: >-
            Host=127.0.0.1;Port=5432;Database=pharma_auto_ci;Username=pharma_auto;Password=pharma_auto_ci;Include Error Detail=true
        run: dotnet test PharmaAuto.Saas.slnx --no-build --no-restore

      - name: Audit NuGet packages
        working-directory: saas-platform
        run: dotnet list PharmaAuto.Saas.slnx package --vulnerable --include-transitive

      - name: Verify PostgreSQL hardening
        shell: bash
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql --username=pharma_auto --dbname=pharma_auto_ci --set=ON_ERROR_STOP=1 \
            --command "SELECT 'tenants'::regclass, 'connector_registrations'::regclass, 'subscriptions'::regclass, 'subscription_periods'::regclass, 'quota_reservations'::regclass, 'ocr_jobs'::regclass, 'canonical_products'::regclass, 'audit_events'::regclass, 'vector'::regtype; SELECT 1 / CASE WHEN count(*) = 6 AND bool_and(relrowsecurity AND relforcerowsecurity) THEN 1 ELSE 0 END FROM pg_class WHERE relname IN ('connector_registrations', 'subscriptions', 'subscription_periods', 'quota_reservations', 'ocr_jobs', 'audit_events');"

  connector:
    name: Local Connector
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        working-directory: local-connector
        run: dotnet restore PharmaAuto.Connector.slnx --locked-mode

      - name: Build
        working-directory: local-connector
        run: dotnet build PharmaAuto.Connector.slnx --no-restore

      - name: Verify formatting
        working-directory: local-connector
        run: dotnet format PharmaAuto.Connector.slnx --verify-no-changes --no-restore

      - name: Test
        working-directory: local-connector
        run: dotnet test PharmaAuto.Connector.slnx --no-build --no-restore

      - name: Audit NuGet packages
        working-directory: local-connector
        run: dotnet list PharmaAuto.Connector.slnx package --vulnerable --include-transitive

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Test, lint and assemble
        working-directory: android-client
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
